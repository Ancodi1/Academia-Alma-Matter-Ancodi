services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=academia

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: academia
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./almamater.sql:/docker-entrypoint-initdb.d/almamater.sql
      - ./optimizaciones.sql:/docker-entrypoint-initdb.d/optimizaciones.sql

volumes:
  db_data: